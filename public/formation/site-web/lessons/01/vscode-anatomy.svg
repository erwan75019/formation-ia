<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">Les douze zones principales de VS Code</title><desc id="d">Interface annotée avec barre d’activité, Explorateur, dossier, fichiers, onglets, éditeur, terminal, problèmes, extensions, recherche, barre d’état et bouton du panneau.</desc><rect width="1200" height="700" rx="24" fill="#111827"/><rect x="20" y="20" width="1160" height="44" rx="8" fill="#1f2937"/><rect x="20" y="76" width="64" height="570" rx="8" fill="#0b1220"/><rect x="92" y="76" width="270" height="570" rx="8" fill="#172033"/><rect x="370" y="76" width="810" height="42" rx="8" fill="#263247"/><rect x="370" y="126" width="810" height="320" rx="8" fill="#0f172a"/><rect x="370" y="454" width="810" height="192" rx="8" fill="#020617"/><rect x="20" y="654" width="1160" height="26" rx="5" fill="#07583f"/><g font-family="Arial" font-weight="700"><g fill="#fff" font-size="18" text-anchor="middle"><text x="52" y="120">1</text><text x="52" y="170">10</text><text x="52" y="220">9</text></g><g fill="#93c5fd" font-size="17"><text x="110" y="110">2 · EXPLORATEUR</text><text x="115" y="158">3 · MES-PROJETS</text><text x="130" y="202">4 · fichiers futurs</text><text x="390" y="104">5 · ONGLETS OUVERTS</text><text x="650" y="270">6 · ZONE D’ÉDITION</text><text x="400" y="488">7 · TERMINAL INTÉGRÉ</text><text x="760" y="488">8 · PROBLÈMES</text><text x="910" y="676">11 · BARRE D’ÉTAT</text><text x="1130" y="630">12</text></g></g><g font-family="Arial" font-size="15" fill="#cbd5e1"><text x="105" y="132">panneau des dossiers</text><text x="105" y="180">dossier parent ouvert</text><text x="125" y="225">un fichier ≠ un dossier</text><text x="390" y="150">Le code s’écrit ici.</text><text x="390" y="178">Le résultat apparaît dans le navigateur.</text><text x="400" y="530">mes-projets % node --version</text><text x="400" y="560" fill="#86efac">v22.0.0</text><text x="760" y="530">Les erreurs détectées apparaîtront ici.</text><text x="35" y="145" transform="rotate(-90 35 145)">barre d’activité</text><text x="35" y="275" transform="rotate(-90 35 275)">recherche · extensions</text><text x="1060" y="610">ouvrir / fermer</text><text x="1060" y="632">le panneau</text></g></svg>
