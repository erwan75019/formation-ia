<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">Infobulle TypeScript dans VS Code</title><desc id="d">Le mot Property est survolé et une infobulle décrit ses champs typés.</desc><rect width="1200" height="560" fill="#111827"/><rect x="55" y="45" width="1090" height="470" rx="18" fill="#1e293b"/><rect x="55" y="45" width="240" height="470" rx="18" fill="#0f172a"/><text x="85" y="100" fill="#94a3b8" font-family="Arial" font-size="18">EXPLORATEUR</text><text x="85" y="155" fill="white" font-family="monospace" font-size="20">types/</text><text x="115" y="195" fill="#9ee5ce" font-family="monospace" font-size="20">property.ts</text><g font-family="monospace" font-size="23"><text x="340" y="120" fill="#c4b5fd">export type <tspan fill="#f8fafc" text-decoration="underline">Property</tspan> = {</text><text x="375" y="165" fill="#9ee5ce">title: string;</text><text x="375" y="205" fill="#9ee5ce">monthlyRent: number;</text><text x="340" y="245" fill="#c4b5fd">};</text></g><rect x="500" y="275" width="565" height="190" rx="12" fill="#020617" stroke="#64748b"/><text x="530" y="320" fill="#f8fafc" font-family="monospace" font-size="21">type Property = {</text><text x="560" y="360" fill="#9ee5ce" font-family="monospace" font-size="20">title: string;</text><text x="560" y="398" fill="#9ee5ce" font-family="monospace" font-size="20">monthlyRent: number;</text><text x="530" y="438" fill="#f8fafc" font-family="monospace" font-size="21">... }</text><path d="M520 275 470 190" stroke="#d4a64a" stroke-width="5"/><text x="750" y="500" text-anchor="middle" fill="#d4a64a" font-family="Arial" font-size="18">Survolez le nom : ne cliquez pas et ne collez rien.</text></svg>
