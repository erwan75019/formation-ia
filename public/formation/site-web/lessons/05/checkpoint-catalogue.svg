<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="t d"><title id="t">Checkpoint du catalogue de quinze logements</title><desc id="d">Accueil PropertyMatch affichant un compteur calculé à quinze sans montrer encore les cartes.</desc><rect width="1200" height="600" fill="#f7f3e8"/><rect x="48" y="42" width="1104" height="516" rx="24" fill="white" stroke="#d7dee7"/><text x="88" y="98" font-family="Arial" font-size="28" font-weight="700" fill="#071a33">Property<tspan fill="#087052">Match</tspan></text><rect x="48" y="126" width="1104" height="270" fill="#071a33"/><text x="88" y="204" font-family="Arial" font-size="44" font-weight="700" fill="white">Un catalogue local, typé et vérifiable</text><text x="88" y="250" font-family="Arial" font-size="20" fill="#dbe6f2">Les cartes seront construites à la leçon 7.</text><rect x="88" y="292" width="280" height="72" rx="12" fill="#fff"/><text x="112" y="320" font-family="Arial" font-size="14" font-weight="700" fill="#64748b">LOGEMENTS DE DÉMONSTRATION</text><text x="112" y="350" font-family="Arial" font-size="28" font-weight="700" fill="#087052">15</text><text x="88" y="454" font-family="Arial" font-size="24" font-weight="700" fill="#071a33">properties.length</text><text x="88" y="492" font-family="Arial" font-size="18" fill="#475569">Le nombre vient réellement du tableau : il n’est pas écrit à la main.</text></svg>
