<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="t d"><title id="t">Circulation des données locales</title><desc id="d">Le type Property contrôle les trois objets locaux avant leur import dans la page.</desc><rect width="1200" height="500" fill="#f7f4eb"/><text x="600" y="65" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#06182f">Des données locales vérifiées par TypeScript</text><g font-family="Arial" text-anchor="middle"><g transform="translate(70 140)"><rect width="280" height="220" rx="24" fill="#06182f"/><text x="140" y="65" fill="#9ee5ce" font-size="20">types/property.ts</text><text x="140" y="115" fill="white" font-size="30" font-weight="700">Type Property</text><text x="140" y="160" fill="#cbd5e1" font-size="17">Le contrat attendu</text></g><g transform="translate(460 140)"><rect width="280" height="220" rx="24" fill="#fff" stroke="#d4a64a" stroke-width="3"/><text x="140" y="65" fill="#07583f" font-size="20">data/properties.ts</text><text x="140" y="115" fill="#06182f" font-size="30" font-weight="700">3 objets</text><text x="140" y="160" fill="#475569" font-size="17">Les valeurs fictives</text></g><g transform="translate(850 140)"><rect width="280" height="220" rx="24" fill="#07583f"/><text x="140" y="65" fill="#d1fae5" font-size="20">app/page.tsx</text><text x="140" y="115" fill="white" font-size="30" font-weight="700">Import</text><text x="140" y="160" fill="#d1fae5" font-size="17">properties.length = 3</text></g></g><g stroke="#31a37c" stroke-width="8" fill="none"><path d="M365 250h75"/><path d="m425 230 25 20-25 20"/><path d="M755 250h75"/><path d="m815 230 25 20-25 20"/></g></svg>
