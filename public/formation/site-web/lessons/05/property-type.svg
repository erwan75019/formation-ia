<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">Anatomie du type Property</title><desc id="d">Les champs texte, nombre et booléen d'un logement sont reliés à leurs types TypeScript.</desc><rect width="1200" height="560" fill="#06182f"/><text x="70" y="70" fill="white" font-family="Arial" font-size="34" font-weight="700">Property = le contrat d’un logement</text><g font-family="monospace" font-size="23"><rect x="70" y="115" width="650" height="365" rx="22" fill="#102b49"/><text x="110" y="165" fill="#9ee5ce">title: string;</text><text x="110" y="215" fill="#9ee5ce">monthlyRent: number;</text><text x="110" y="265" fill="#9ee5ce">bedrooms: number;</text><text x="110" y="315" fill="#9ee5ce">hasBalcony: boolean;</text><text x="110" y="365" fill="#9ee5ce">imagePath: string;</text><text x="110" y="415" fill="#9ee5ce">imageAlt: string;</text></g><g font-family="Arial"><rect x="790" y="130" width="340" height="80" rx="14" fill="#fffdf7"/><text x="820" y="180" fill="#06182f" font-size="22"><tspan font-weight="700">string</tspan> = texte</text><rect x="790" y="240" width="340" height="80" rx="14" fill="#fffdf7"/><text x="820" y="290" fill="#06182f" font-size="22"><tspan font-weight="700">number</tspan> = nombre</text><rect x="790" y="350" width="340" height="80" rx="14" fill="#fffdf7"/><text x="820" y="400" fill="#06182f" font-size="22"><tspan font-weight="700">boolean</tspan> = vrai/faux</text></g></svg>
