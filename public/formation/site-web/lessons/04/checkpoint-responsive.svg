<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">Checkpoint responsive de la leçon 4</title><desc id="d">Accueil PropertyMatch stylé, montré en version ordinateur et mobile sans fonctionnalité future.</desc><rect width="1200" height="650" fill="#f7f3e8"/><rect x="40" y="38" width="780" height="574" rx="18" fill="#fff" stroke="#cbd5e1"/><rect x="40" y="38" width="780" height="64" rx="18" fill="#fff"/><text x="76" y="78" font-family="Arial" font-size="24" font-weight="700" fill="#071a33">Property<tspan fill="#087052">Match</tspan></text><text x="555" y="76" font-family="Arial" font-size="15" fill="#071a33">Accueil   Biens   À propos</text><rect x="40" y="102" width="780" height="350" fill="#071a33"/><text x="78" y="174" font-family="Arial" font-size="40" font-weight="700" fill="white">Trouvez le bien qui vous</text><text x="78" y="220" font-family="Arial" font-size="40" font-weight="700" fill="white">correspond vraiment</text><rect x="78" y="260" width="610" height="132" rx="14" fill="white"/><rect x="100" y="292" width="124" height="42" rx="7" fill="#f8fafc" stroke="#cbd5e1"/><rect x="238" y="292" width="124" height="42" rx="7" fill="#f8fafc" stroke="#cbd5e1"/><rect x="376" y="292" width="124" height="42" rx="7" fill="#f8fafc" stroke="#cbd5e1"/><rect x="514" y="292" width="150" height="42" rx="7" fill="#f8fafc" stroke="#cbd5e1"/><rect x="100" y="350" width="564" height="28" rx="7" fill="#087052"/><text x="310" y="370" font-family="Arial" font-size="13" font-weight="700" fill="white">Recherche disponible à la leçon 8</text><text x="78" y="500" font-family="Arial" font-size="24" font-weight="700" fill="#071a33">Premier checkpoint visuel</text><text x="78" y="532" font-family="Arial" font-size="16" fill="#475569">Structure, couleurs et responsive uniquement</text><rect x="858" y="38" width="302" height="574" rx="28" fill="#fff" stroke="#cbd5e1"/><rect x="858" y="38" width="302" height="68" rx="28" fill="#fff"/