<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="t d"><title id="t">Avant et après Tailwind</title><desc id="d">La même structure PropertyMatch passe d'un affichage brut à une interface marine, ivoire et verte.</desc><rect width="1200" height="640" fill="#f7f4eb"/><text x="80" y="70" font-family="Arial" font-size="30" font-weight="700" fill="#06182f">Avant : structure HTML</text><text x="660" y="70" font-family="Arial" font-size="30" font-weight="700" fill="#06182f">Après : classes Tailwind</text><g transform="translate(70 100)"><rect width="480" height="450" rx="10" fill="white" stroke="#94a3b8"/><rect x="25" y="25" width="160" height="24" fill="#cbd5e1"/><rect x="25" y="80" width="430" height="100" fill="#e2e8f0"/><rect x="25" y="205" width="430" height="34" fill="#e2e8f0"/><rect x="25" y="255" width="430" height="34" fill="#e2e8f0"/><rect x="25" y="305" width="430" height="34" fill="#e2e8f0"/><text x="25" y="405" font-family="Arial" font-size="22" fill="#475569">Contenu lisible, peu stylé</text></g><g transform="translate(650 100)"><rect width="480" height="450" rx="18" fill="white" stroke="#d4a64a"/><rect width="480" height="65" rx="18" fill="white"/><text x="25" y="42" font-family="Arial" font-size="25" font-weight="700" fill="#06182f">Property<tspan fill="#07583f">Match</tspan></text><rect y="65" width="480" height="235" fill="#06182f"/><text x="25" y="115" font-family="Arial" font-size="26" font-weight="700" fill="white">Trouvez votre location</text><rect x="25" y="145" width="430" height="125" rx="14" fill="#fffdf7"/><g fill="#e2e8f0"><rect x="45" y="170" width="180" height="34" rx="6"/><rect x="255" y="170" width="180" height="34" rx="6"/></g><rect x="45" y="220" width="390" height="30" rx="6" fill="#07583f"/><text x="25" y="355" font-family="Arial" font-size="22" font-weight="700" fill="#06182f">Même contenu, hiérarchie visible</text></g><path d="M570 315h55" stroke="#31a37c" stroke-width=