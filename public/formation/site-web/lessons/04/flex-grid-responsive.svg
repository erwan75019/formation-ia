<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Flex, Grid et responsive</title><desc id="d">Le formulaire passe d'une colonne sur mobile à deux sur tablette puis quatre sur ordinateur.</desc><rect width="1200" height="620" fill="#06182f"/><text x="70" y="72" fill="white" font-family="Arial" font-size="34" font-weight="700">Une structure, trois largeurs</text><g font-family="Arial" text-anchor="middle"><g transform="translate(70 120)"><text x="145" y="0" fill="#9ee5ce" font-size="24">Mobile · classe de base</text><rect y="30" width="290" height="420" rx="25" fill="#fffdf7"/><g fill="#dce9e4"><rect x="25" y="65" width="240" height="55" rx="8"/><rect x="25" y="140" width="240" height="55" rx="8"/><rect x="25" y="215" width="240" height="55" rx="8"/><rect x="25" y="290" width="240" height="55" rx="8"/></g><rect x="25" y="370" width="240" height="50" rx="8" fill="#07583f"/></g><g transform="translate(405 120)"><text x="190" y="0" fill="#9ee5ce" font-size="24">Tablette · md:grid-cols-2</text><rect y="30" width="380" height="420" rx="25" fill="#fffdf7"/><g fill="#dce9e4"><rect x="25" y="75" width="155" height="80" rx="8"/><rect x="200" y="75" width="155" height="80" rx="8"/><rect x="25" y="180" width="155" height="80" rx="8"/><rect x="200" y="180" width="155" height="80" rx="8"/></g><rect x="25" y="300" width="330" height="55" rx="8" fill="#07583f"/></g><g transform="translate(830 120)"><text x="150" y="0" fill="#9ee5ce" font-size="24">Bureau · lg:grid-cols-4</text><rect y="30" width="300" height="420" rx="25" fill="#fffdf7"/><g fill="#dce9e4"><rect x="15" y="90" width="58" height="105" rx="7"/><rect x="85" y="90" width="58" height="105" rx="7"/><rect x="157" y="90" width="58" height="105" rx="7"/><rect x="227" y="90" width="58" height="105" rx="7"/></g><rect x="15" y="235" width="270" height="55" rx="8" fill="#07583f"/></g></g></svg>
