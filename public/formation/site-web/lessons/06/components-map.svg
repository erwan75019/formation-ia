<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">Découpage en composants React</title><desc id="d">Une page monolithique devient un assemblage de sept composants nommés.</desc><rect width="1200" height="650" fill="#06182f"/><text x="600" y="65" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="white">Même interface, code mieux organisé</text><rect x="70" y="120" width="330" height="440" rx="24" fill="#fffdf7"/><text x="235" y="175" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#06182f">app/page.tsx</text><g fill="#cbd5e1"><rect x="110" y="210" width="250" height="55" rx="8"/><rect x="110" y="285" width="250" height="120" rx="8"/><rect x="110" y="425" width="250" height="50" rx="8"/><rect x="110" y="495" width="250" height="35" rx="8"/></g><path d="M430 340h120" stroke="#31a37c" stroke-width="9"/><path d="m530 315 30 25-30 25" fill="none" stroke="#31a37c" stroke-width="9"/><g font-family="Arial" font-size="20" font-weight="700"><rect x="600" y="120" width="235" height="70" rx="13" fill="#9ee5ce"/><text x="717" y="163" text-anchor="middle" fill="#06182f">Header + Logo</text><rect x="865" y="120" width="265" height="70" rx="13" fill="#9ee5ce"/><text x="997" y="163" text-anchor="middle" fill="#06182f">Hero + SearchForm</text><rect x="600" y="230" width="235" height="70" rx="13" fill="#fffdf7"/><text x="717" y="273" text-anchor="middle" fill="#06182f">StatsStrip</text><rect x="865" y="230" width="265" height="70" rx="13" fill="#fffdf7"/><text x="997" y="273" text-anchor="middle" fill="#06182f">FeaturedProperties</text><rect x="730" y="340" width="265" height="70" rx="13" fill="#d4a64a"/><text x="862" y="383" text-anchor="middle" fill="#06182f">Footer</text></g><text x="865" y="490" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="22">Chaque fichier a un rôle clair</text></svg>
