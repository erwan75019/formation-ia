<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="t d"><title id="t">Checkpoint du découpage en composants</title><desc id="d">Le même accueil avant et après extraction des composants, sans fonctionnalité future.</desc><rect width="1200" height="600" fill="#f8fafc"/><text x="60" y="62" font-family="Arial" font-size="28" font-weight="700" fill="#071a33">Même résultat visible, code mieux organisé</text><rect x="60" y="100" width="470" height="420" rx="18" fill="white" stroke="#cbd5e1"/><text x="90" y="142" font-family="Arial" font-size="20" font-weight="700" fill="#071a33">Avant : app/page.tsx</text><rect x="90" y="170" width="410" height="310" rx="12" fill="#071a33"/><text x="118" y="216" font-family="monospace" font-size="16" fill="#dbeafe">&lt;header&gt;...&lt;/header&gt;</text><text x="118" y="254" font-family="monospace" font-size="16" fill="#dbeafe">&lt;main&gt;</text><text x="142" y="292" font-family="monospace" font-size="16" fill="#dbeafe">&lt;section&gt;hero&lt;/section&gt;</text><text x="142" y="330" font-family="monospace" font-size="16" fill="#dbeafe">&lt;section&gt;indicateurs&lt;/section&gt;</text><text x="118" y="368" font-family="monospace" font-size="16" fill="#dbeafe">&lt;/main&gt;</text><text x="118" y="406" font-family="monospace" font-size="16" fill="#dbeafe">&lt;footer&gt;...&lt;/footer&gt;</text><path d="M555 310h90" stroke="#087052" stroke-width="8"/><path d="m630 286 28 24-28 24" fill="none" stroke="#087052" stroke-width="8"/><rect x="680" y="100" width="460" height="420" rx="18" fill="white" stroke="#cbd5e1"/><text x="710" y="142" font-family="Arial" font-size="20" font-weight="700" fill="#071a33">Après : composants/</text><g font-family="monospace" font-size="18"><rect x="710" y="176" width="400" height="50" rx="8" fill="#e8f5ef"/><text x="734" y="208" fill="#07583f">Header.tsx</text><rect x="710" y="240" width="400" height="50" rx="8" fill="#e8f5ef"/><text x="734" y="272" fill="#07583f">Hero.tsx</text><rect x="710" y="304" width="400" height="50" rx="8" fill="#e8f5ef"/><text x="734" y="336" fill="#07583f">StatsStrip.tsx</text><rect x="710" y="368" width="400" height="50" rx="8" fill="#e8f5ef"/><text x="734" y="400" fill="#07583f">Footer.tsx</text></g><text x="710" y="466" font-family="Arial" font-size="16" fill="#475569">page.tsx assemble les composants.</text><text x="710" y="492" font-family="Arial" font-size="16" fill="#475569">L’écran ne change pas.</text></svg>
