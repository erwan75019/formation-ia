<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="t d"><title id="t">Anatomie d'un import React</title><desc id="d">Le nom Header, son chemin et la balise autofermée sont reliés au fichier Header.tsx.</desc><rect width="1200" height="500" fill="#f7f4eb"/><text x="600" y="65" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#06182f">Du fichier à la balise React</text><rect x="95" y="115" width="1010" height="110" rx="18" fill="#06182f"/><text x="135" y="180" fill="white" font-family="monospace" font-size="29">import <tspan fill="#9ee5ce">Header</tspan> from <tspan fill="#d4a64a">"@/components/Header"</tspan>;</text><rect x="95" y="310" width="1010" height="110" rx="18" fill="white" stroke="#d4a64a" stroke-width="3"/><text x="135" y="375" fill="#06182f" font-family="monospace" font-size="31">&lt;<tspan fill="#07583f" font-weight="700">Header</tspan> /&gt;</text><g font-family="Arial" font-size="18" fill="#475569"><text x="250" y="265">Nom en majuscule</text><text x="715" y="265">Chemin depuis la racine @/</text><text x="310" y="465">Balise autofermée : aucun contenu intérieur</text></g><g stroke="#31a37c" stroke-width="4"><path d="M285 220v28"/><path d="M755 220v28"/><path d="M250 385v52"/></g></svg>
