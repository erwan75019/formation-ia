<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Trajet d’une page web</title>
  <desc id="desc">Le navigateur utilise une URL, envoie une requête au serveur, puis reçoit une réponse à afficher.</desc>
  <rect width="1200" height="420" rx="28" fill="#FAFAF8"/>
  <g font-family="Arial, sans-serif" fill="#06182F">
    <text x="600" y="55" text-anchor="middle" font-size="28" font-weight="700">Comment une page arrive dans le navigateur</text>
    <g transform="translate(55 115)">
      <rect width="230" height="190" rx="20" fill="#fff" stroke="#CBD5E1" stroke-width="2"/>
      <rect x="25" y="35" width="180" height="110" rx="8" fill="#E2E8F0" stroke="#06182F" stroke-width="3"/>
      <circle cx="43" cy="53" r="5" fill="#07583F"/><circle cx="60" cy="53" r="5" fill="#94A3B8"/>
      <text x="115" y="175" text-anchor="middle" font-size="20" font-weight="700">1. Navigateur</text>
    </g>
    <g transform="translate(360 115)">
      <rect width="180" height="78" rx="16" fill="#06182F"/>
      <text x="90" y="34" text-anchor="middle" font-size="16" fill="#A7F3D0">URL</text>
      <text x="90" y="58" text-anchor="middle" font-size="17" fill="#fff">propertymatch.fr</text>
      <text x="90" y="175" text-anchor="middle" font-size="20" font-weight="700">2. Adresse</text>
    </g>
    <g transform="translate(665 115)">
      <rect width="230" height="190" rx="20" fill="#06182F"/>
      <rect x="35" y="35" width="160" height="25" rx="5" fill="#07583F"/>
      <rect x="35" y="75" width="160" height="25" rx="5" fill="#fff" opacity=".8"/>
      <rect x="35" y="115" width="160" height="25" rx="5" fill="#fff" opacity=".5"/>
      <text x="115" y="175" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">3. Serveur</text>
    </g>
    <path d="M285 170H350" stroke="#07583F" stroke-width="5" marker-end="url(#arrow)"/>
    <path d="M540 170H655" stroke="#07583F" stroke-width="5" marker-end="url(#arrow)"/>
    <path d="M665 260H300" stroke="#C68A2B" stroke-width="5" marker-end="url(#arrowGold)"/>
    <text x="600" y="151" text-anchor="middle" font-size="16" font-weight="700">REQUÊTE HTTP →</text>
    <text x="475" y="290" text-anchor="middle" font-size="16" font-weight="700">← RÉPONSE</text>
    <g transform="translate(970 145)">
      <rect width="175" height="110" rx="18" fill="#fff" stroke="#07583F" stroke-width="3"/>
      <text x="88" y="45" text-anchor="middle" font-size="17" font-weight="700">Frontend</text>
      <text x="88" y="73" text-anchor="middle" font-size="14">ce que vous voyez</text>
      <text x="88" y="98" text-anchor="middle" font-size="14">et utilisez</text>
    </g>
  </g>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#07583F"/></marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#C68A2B"/></marker>
  </defs>
</svg>
