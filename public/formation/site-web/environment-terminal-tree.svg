<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Terminal et arborescence attendus</title>
  <desc id="desc">À gauche, les commandes de vérification et de création. À droite, les principaux dossiers du projet PropertyMatch.</desc>
  <rect width="1200" height="620" rx="28" fill="#F1F5F9"/>
  <text x="600" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#06182F">Ce que vous devez obtenir après la création</text>
  <g transform="translate(45 90)">
    <rect width="650" height="470" rx="18" fill="#07182F"/>
    <rect width="650" height="48" rx="18" fill="#102742"/><circle cx="28" cy="24" r="7" fill="#F87171"/><circle cx="52" cy="24" r="7" fill="#FBBF24"/><circle cx="76" cy="24" r="7" fill="#34D399"/><text x="325" y="30" text-anchor="middle" font-family="Arial" font-size="15" fill="#CBD5E1">Terminal — propertymatch</text>
    <g font-family="monospace" font-size="18"><text x="28" y="92" fill="#A7F3D0">$ node --version</text><text x="28" y="122" fill="#fff">v22.x.x</text><text x="28" y="168" fill="#A7F3D0">$ npm --version</text><text x="28" y="198" fill="#fff">10.x.x</text><text x="28" y="244" fill="#A7F3D0">$ git --version</text><text x="28" y="274" fill="#fff">git version 2.x.x</text><text x="28" y="320" fill="#A7F3D0">$ npx create-next-app@latest propertymatch</text><text x="28" y="366" fill="#A7F3D0">$ cd propertymatch</text><text x="28" y="412" fill="#A7F3D0">$ npm run dev</text><text x="28" y="448" fill="#93C5FD">Local: http://localhost:3000</text></g>
  </g>
  <g transform="translate(740 90)">
    <rect width="415" height="470" rx="18" fill="#fff" stroke="#CBD5E1" stroke-width="2"/>
    <text x="28" y="48" font-family="Arial" font-size="18" font-weight="700" fill="#06182F">EXPLORATEUR VS CODE</text>
    <g font-family="monospace" font-size="19" fill="#334155"><text x="28" y="95" font-weight="700">▾ PROPERTYMATCH</text><text x="52" y="137">▾ app</text><text x="80" y="177" fill="#07583F">page.tsx  ← à ouvrir</text><text x="80" y="215">layout.tsx</text><text x="80" y="253">globals.css</text><text x="52" y="301">▸ public</text><text x="52" y="339">package.json</text><text x="52" y="377">tsconfig.json</text><text x="52" y="415">next.config.ts</text><text x="52" y="453">.gitignore</text></g>
  </g>
</svg>
